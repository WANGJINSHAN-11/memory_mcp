[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "plaintext-memory-mcp"
version = "0.6.0"
description = "本地纯文本长期记忆 MCP 服务器：一份记忆目录，多个 AI 客户端共用（Cherry Studio / Claude Desktop / DeepSeek Harness）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "WANGJINSHAN-11", url = "https://github.com/WANGJINSHAN-11" },
]
keywords = ["mcp", "memory", "ai-agent", "claude", "cherry-studio", "local-first", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.3.0"]

[project.urls]
Homepage = "https://github.com/WANGJINSHAN-11/memory_mcp"
Repository = "https://github.com/WANGJINSHAN-11/memory_mcp"
Issues = "https://github.com/WANGJINSHAN-11/memory_mcp/issues"
Changelog = "https://github.com/WANGJINSHAN-11/memory_mcp/blob/main/CHANGELOG.md"

[project.scripts]
plaintext-memory-mcp = "plaintext_memory_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["plaintext_memory_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "plaintext_memory_mcp/",
  "server.py",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "requirements.txt",
  "examples/",
  "templates/",
]
